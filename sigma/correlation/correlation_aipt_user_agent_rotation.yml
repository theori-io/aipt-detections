title: Scanner-Grade User-Agent Rotation Among 404 Responses From a Single Client
id: 7c15f6c6-f824-4f5b-9e84-a4a69ef0ffa2
name: correlation_aipt_user_agent_rotation
status: experimental
description: |
    Detects 50 or more distinct User-Agent strings among the 404 responses of one client within 10 minutes
    (web_aipt_http_404_base): the rotation of dirsearch and nuclei templates. Lab: CyberStrikeAI reached 863 on one target
    in 10 minutes when the model ran a scanner with User-Agent rotation (local 7B model run); with a hosted model
    (run 03) it chose scanners with fixed User-Agents and showed 4, so the rule depends on the tool the model selects.
    ARTEX 2-4, the benign browser 1, ZAP 2. On the synthetic benign corpus (docs/fp-report.md) 0
    windows (partner API gateways with many clients behind one address do not reach the threshold); no window in the
    hosted-model runs 01-03.
    Thresholds were measured in an isolated lab against ARTEX, CyberStrikeAI, a scripted benign browser and a ZAP
    baseline, first with a CPU-bound local 7B model and then, with the figures quoted above, with a hosted model
    (GLM-5.3, runs 01-03: ARTEX default and tuned configuration, CyberStrikeAI; LLM latency p50 6-20 s). Burst size
    and path or UA counts depend on the tool mix and on the tools the model chooses, not on the model's speed.
    Re-baseline against your own traffic before alerting.
references:
    - https://github.com/SigmaHQ/sigma-specification/blob/ba9251aa834b11a70dbf80836b453dba99c5159e/specification/sigma-correlation-rules-specification.md
author: Xint
date: 2026-10-09
modified: 2026-10-13
tags:
    - attack.reconnaissance
    - attack.t1595.002
correlation:
    type: value_count
    rules:
        - web_aipt_http_404_base
    group-by:
        - c-ip
    timespan: 10m
    condition:
        field: cs-user-agent
        gte: 50
    generate: false
falsepositives:
    - Large NAT gateways and forward proxies whose users hit many missing pages
level: low
