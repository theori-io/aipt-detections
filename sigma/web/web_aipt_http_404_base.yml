title: HTTP 404 Response Base Rule for AIPT Correlations
id: d34dc9e3-aba4-4832-acae-22d932d93676
name: web_aipt_http_404_base
status: experimental
description: |
    CORRELATION BASE SELECTOR - DO NOT DEPLOY AS A STAND-ALONE ALERT. Used only by the correlations in
    sigma/correlation/ (generate: false there); excluded from stand-alone conversion in the README commands and the
    test harness (README, "Format notes"). Base rule matching responses with status 404 for the 404-burst correlation. It never alerts on its own.
    Sanctioned assessments are exempted when the client is listed in %approved_assessment_sources% and its User-
    Agent in %approved_assessment_user_agents% (placeholders.yaml); both lists ship empty.
references:
    - https://github.com/SigmaHQ/sigma-specification/blob/ba9251aa834b11a70dbf80836b453dba99c5159e/specification/sigma-correlation-rules-specification.md
author: Xint
date: 2026-10-09
modified: 2026-10-10
tags:
    - attack.discovery
    - attack.t1083
logsource:
    category: webserver
detection:
    selection:
        sc-status: 404
    filter_main_approved_assessment_src:
        c-ip|expand: '%approved_assessment_sources%'
    filter_main_approved_assessment_ua:
        - cs-user-agent|expand: '%approved_assessment_user_agents%'
        - cs-user-agent: null
    condition: selection and not (filter_main_approved_assessment_src and filter_main_approved_assessment_ua)
falsepositives:
    - Base rule; every 404 matches
level: informational
