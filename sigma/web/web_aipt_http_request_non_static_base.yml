title: HTTP Request to a Non-Static Path Base Rule for AIPT Correlations
id: a55e4fba-e3b6-44c4-afa9-c1fd6540a335
name: web_aipt_http_request_non_static_base
status: experimental
description: |
    CORRELATION BASE SELECTOR - DO NOT DEPLOY AS A STAND-ALONE ALERT. Used only by the correlations in
    sigma/correlation/ (generate: false there); excluded from stand-alone conversion in the README commands and the
    test harness (README, "Format notes"). Base rule for the distinct-path correlation: every logged HTTP request except static assets (scripts, styles,
    images, fonts, source maps and /static/ or /assets/ trees), which a browser fetches in bulk on a single page
    load. It never alerts on its own. Sanctioned assessments are exempted when the client is listed in
    %approved_assessment_sources% and its User-Agent in %approved_assessment_user_agents% (placeholders.yaml); both
    lists ship empty.
references:
    - https://github.com/SigmaHQ/sigma-specification/blob/ba9251aa834b11a70dbf80836b453dba99c5159e/specification/sigma-correlation-rules-specification.md
author: Xint
date: 2026-10-09
modified: 2026-10-10
tags:
    - attack.reconnaissance
    - attack.t1595
logsource:
    category: webserver
detection:
    selection:
        cs-method:
            - 'GET'
            - 'POST'
            - 'HEAD'
            - 'OPTIONS'
            - 'PUT'
            - 'DELETE'
            - 'PATCH'
    filter_main_static_ext:
        cs-uri-stem|endswith:
            - '.js'
            - '.css'
            - '.png'
            - '.jpg'
            - '.jpeg'
            - '.gif'
            - '.svg'
            - '.ico'
            - '.webp'
            - '.woff'
            - '.woff2'
            - '.ttf'
            - '.map'
    filter_main_static_dir:
        cs-uri-stem|contains:
            - '/static/'
            - '/assets/'
    filter_main_approved_assessment_src:
        c-ip|expand: '%approved_assessment_sources%'
    filter_main_approved_assessment_ua:
        - cs-user-agent|expand: '%approved_assessment_user_agents%'
        - cs-user-agent: null
    condition: selection and not 1 of filter_main_static_* and not (filter_main_approved_assessment_src and filter_main_approved_assessment_ua)
falsepositives:
    - Base rule; most requests match
level: informational
