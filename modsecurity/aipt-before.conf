# ------------------------------------------------------------------------------------------------------------------
# AIPT CRS plugin - rules (aipt-before.conf)
# Detection pack for LLM-driven autonomous pentest tools; OWASP CRS v4 plugin, ModSecurity v3 / v2.9
# Version:  1.0.0 (2026-10-12)
# License:  Detection Rule License (DRL) 1.1 - https://github.com/SigmaHQ/Detection-Rule-License
# Ids, install and switches: see aipt-config.conf.
# Blocking policy (measured false-positive profile in docs/fp-report.md): every rule is pass,log and carries
# tag:'aipt/block-eligible', 'aipt/alert' or 'aipt/informational'. As shipped the plugin is OBSERVE-ONLY: no rule adds
# an anomaly score, so the plugin never contributes to a CRS block whatever the host's SecRuleEngine and thresholds
# are. Scoring is opt-in per direction (aipt-config.conf): with switch 9590015 the product User-Agent rules of ARTEX
# (9590101, 9590103), CyberStrikeAI (9590201), HexStrike-AI (9590211) and PentAGI (9590221), which run in phase 1
# before CRS initialises its anomaly scores (REQUEST-901), raise the flag tx.aipt-plugin_critical_hit and rule 9590090
# adds the CRS critical inbound score for it in phase 2; blocking then follows the normal CRS inbound threshold. With
# switch 9590013 the ARTEX console response fingerprint 9590401 adds the critical OUTBOUND score (rule 9590091), for a
# WAF that fronts an ARTEX console. Every other rule (generic shapes, scanner User-Agents, console paths, other
# response fingerprints) never scores. The idle-timeout counters 9590310-9590315 stay off by default. Enable a switch
# only after the observe-mode baseline of DEPLOYMENT.md, per WAF; commenting it out again is the rollback.
# Paranoia: generic supporting rules (9590301-9590304) run from detection paranoia level 2; everything else at 1.
#   This file runs before CRS REQUEST-901 initialises its defaults, so the plugin computes its own level
#   tx.aipt-plugin_detection_pl the way CRS will: 1 by default, the blocking level when only
#   tx.blocking_paranoia_level is set (CRS sets the detection level to the blocking level in that case), and the
#   detection level when it is set and higher. Deployments that set only BLOCKING_PARANOIA=2 therefore keep
#   9590301-9590304.
# ------------------------------------------------------------------------------------------------------------------

# ---- plugin control ----
SecRule TX:aipt-plugin_enabled "@eq 0" \
    "id:9590099,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',ctl:ruleRemoveById=9590100-9590999"
SecRule &TX:aipt-plugin_rate_counters "@eq 0" \
    "id:9590020,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',setvar:'tx.aipt-plugin_rate_counters=0'"
SecRule TX:aipt-plugin_rate_counters "@eq 0" \
    "id:9590021,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',ctl:ruleRemoveById=9590310-9590319"
SecAction \
    "id:9590022,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',setvar:'tx.aipt-plugin_detection_pl=1'"
SecRule &TX:blocking_paranoia_level "@eq 1" \
    "id:9590024,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',setvar:'tx.aipt-plugin_detection_pl=%{tx.blocking_paranoia_level}'"
SecRule &TX:detection_paranoia_level "@eq 1" \
    "id:9590025,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',chain"
    SecRule TX:detection_paranoia_level "@gt %{tx.aipt-plugin_detection_pl}" \
        "setvar:'tx.aipt-plugin_detection_pl=%{tx.detection_paranoia_level}'"
SecRule TX:aipt-plugin_detection_pl "@lt 2" \
    "id:9590023,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',ctl:ruleRemoveById=9590301-9590304"
SecRule TX:aipt-plugin_critical_hit "@eq 1" \
    "id:9590090,phase:2,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',chain"
    SecRule TX:aipt-plugin_inbound_scoring "@eq 1" "t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

