# ---- AI-pentest family (tool-specific) ----
# source: CyberStrikeAI internal/handler/fofa.go:652, internal/handler/webshell.go:798
SecRule REQUEST_HEADERS:User-Agent "@rx (?:^CyberStrikeAI/|CyberStrikeAI-WebShell/)" \
    "id:9590201,phase:1,pass,log,t:none,msg:'AIPT: CyberStrikeAI client or WebShell manager User-Agent',logdata:'%{MATCHED_VAR}',tag:'aipt',tag:'aipt/cyberstrikeai',tag:'aipt/block-eligible',tag:'attack-reputation-scanner',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'CRITICAL',setvar:'tx.aipt-plugin_critical_hit=1'"
# source: CyberStrikeAI internal/app/app.go:1017-1044,1114-1147,1336-1381,1457 (supporting: scanners request these paths too)
SecRule REQUEST_FILENAME "@rx ^/api/(?:eino-agent/stream|multi-agent/stream|agent-loop/|hitl/|tool-guard|external-mcp|webshell/|c2/listeners|c2/payloads/build|openapi/spec)" \
    "id:9590202,phase:1,pass,log,t:none,msg:'AIPT: CyberStrikeAI console API route',logdata:'%{MATCHED_VAR}',tag:'aipt',tag:'aipt/cyberstrikeai',tag:'aipt/alert',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'NOTICE'"
# source: CyberStrikeAI config.example.yaml:428, internal/config/config.go:1853
SecRule &REQUEST_HEADERS:X-MCP-Token "@gt 0" \
    "id:9590203,phase:1,pass,log,t:none,msg:'AIPT: CyberStrikeAI MCP auth header X-MCP-Token',tag:'aipt',tag:'aipt/cyberstrikeai',tag:'aipt/alert',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'NOTICE'"
# source: HexStrike-AI hexstrike_server.py:13287,7098
SecRule REQUEST_HEADERS:User-Agent "@rx (?:^HexStrike-HTTP-Framework/|^Mozilla/5\.0 \(Compatible Exploit\)$)" \
    "id:9590211,phase:1,pass,log,t:none,msg:'AIPT: HexStrike-AI User-Agent',logdata:'%{MATCHED_VAR}',tag:'aipt',tag:'aipt/hexstrike-ai',tag:'aipt/block-eligible',tag:'attack-reputation-scanner',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'CRITICAL',setvar:'tx.aipt-plugin_critical_hit=1'"
# source: HexStrike-AI hexstrike_server.py:98,9137-9226,10327 (API of a HexStrike server behind this WAF)
SecRule SERVER_PORT "@eq 8888" \
    "id:9590212,phase:1,pass,log,t:none,msg:'AIPT: HexStrike-AI command, file or tool API request on 8888',logdata:'%{REQUEST_FILENAME}',tag:'aipt',tag:'aipt/hexstrike-ai',tag:'aipt/alert',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING',chain"
    SecRule REQUEST_FILENAME "@rx ^/api/(?:command$|files/(?:create|modify|delete|list)$|payloads/generate$|tools/)" "t:none"
# source: PentAGI backend/pkg/tools/searchers/searxng.go:121
SecRule REQUEST_HEADERS:User-Agent "@beginsWith PentAGI/" \
    "id:9590221,phase:1,pass,log,t:none,msg:'AIPT: PentAGI searcher User-Agent',logdata:'%{MATCHED_VAR}',tag:'aipt',tag:'aipt/pentagi',tag:'aipt/block-eligible',tag:'attack-reputation-scanner',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'CRITICAL',setvar:'tx.aipt-plugin_critical_hit=1'"
# id 9590222 (PentAGI GraphQL API request on 8443) removed before 1.0.0: PentAGI publishes 8443 on 127.0.0.1 by default and the path is a
# generic GraphQL layout; ids are never reused
# source: MetasploitMCP.py:1643,1666-1667,1725,1758. --host defaults to 127.0.0.1: only instances started with --host 0.0.0.0 (the README
# example) or reverse-proxied are visible; any FastMCP SSE server on 8085 looks the same
SecRule SERVER_PORT "@eq 8085" \
    "id:9590231,phase:1,pass,log,t:none,msg:'AIPT: MetasploitMCP SSE endpoint request on 8085',tag:'aipt',tag:'aipt/metasploitmcp',tag:'aipt/informational',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING',chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:sse$|messages/)" "t:none"

# ---- generic shapes (log only; removed for approved assessment sources by 9590012) ----
# source: earlier local-model CyberStrikeAI lab run (scanner templates probing manifest.json without Referer); paranoia level 2; browsers send
# Sec-Fetch-Dest with manifest fetches (no-referrer sites, PWA refreshes), so requests carrying it are not reported
SecRule REQUEST_METHOD "@streq GET" \
    "id:9590301,phase:1,pass,log,t:none,msg:'AIPT: Generic web app manifest probe without Referer',logdata:'%{REQUEST_FILENAME}',tag:'aipt',tag:'aipt/generic',tag:'aipt/informational',tag:'paranoia-level/2',ver:'aipt-plugin/1.0.0',severity:'NOTICE',chain"
    SecRule REQUEST_FILENAME "@rx (?:^|/)(?:asset-manifest\.json|\.vite/manifest\.json|manifest\.json)$" "t:none,chain"
        SecRule &REQUEST_HEADERS:Referer "@eq 0" "t:none,chain"
            SecRule &REQUEST_HEADERS:Sec-Fetch-Dest "@eq 0" "t:none"
# source: ARTEX Dockerfile:28, db/db.go:264 (any browser automation); paranoia level 2
SecRule REQUEST_HEADERS:User-Agent "@contains HeadlessChrome/" \
    "id:9590302,phase:1,pass,log,t:none,msg:'AIPT: Generic headless Chromium User-Agent',logdata:'%{MATCHED_VAR}',tag:'aipt',tag:'aipt/generic',tag:'aipt/informational',tag:'paranoia-level/2',ver:'aipt-plugin/1.0.0',severity:'NOTICE'"
# source: ARTEX server/customtool.go:435-444 (any Go program); paranoia level 2
SecRule REQUEST_HEADERS:User-Agent "@beginsWith Go-http-client/" \
    "id:9590303,phase:1,pass,log,t:none,msg:'AIPT: Generic Go-http-client default User-Agent',logdata:'%{MATCHED_VAR}',tag:'aipt',tag:'aipt/generic',tag:'aipt/informational',tag:'paranoia-level/2',ver:'aipt-plugin/1.0.0',severity:'NOTICE'"
# source: MCP Streamable-HTTP headers (similar-tools.md 7 A.3); paranoia level 2
SecRule &REQUEST_HEADERS:Mcp-Session-Id|&REQUEST_HEADERS:MCP-Protocol-Version "@gt 0" \
    "id:9590304,phase:1,pass,log,t:none,msg:'AIPT: Generic MCP Streamable-HTTP header',tag:'aipt',tag:'aipt/generic',tag:'aipt/informational',tag:'paranoia-level/2',ver:'aipt-plugin/1.0.0',severity:'NOTICE'"
# source: CyberStrikeAI lab runs (nuclei default UA, an outdated Chrome 87 build string)
SecRule REQUEST_HEADERS:User-Agent "@contains Chrome/87.0.4280.88" \
    "id:9590305,phase:1,pass,log,t:none,msg:'AIPT: Scanner nuclei default User-Agent',logdata:'%{MATCHED_VAR}',tag:'aipt',tag:'aipt/generic',tag:'aipt/alert',tag:'attack-reputation-scanner',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING'"
# source: similar-tools.md 7 A.2 (nuclei project, ffuf, sqlmap, gobuster, Nikto)
SecRule REQUEST_HEADERS:User-Agent "@rx (?:Nuclei - Open-source project|Fuzz Faster U Fool|^sqlmap/|^gobuster/|\(Nikto/)" \
    "id:9590306,phase:1,pass,log,t:none,msg:'AIPT: Scanner User-Agent (nuclei, ffuf, sqlmap, gobuster, Nikto)',logdata:'%{MATCHED_VAR}',tag:'aipt',tag:'aipt/generic',tag:'aipt/alert',tag:'attack-reputation-scanner',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING'"
# Idle-timeout accumulators (off unless tx.aipt-plugin_rate_counters=1; REQUIRE A PERSISTENT COLLECTION BACKEND, see
# aipt-config.conf). Not sliding windows: every matching response/request adds 1 and re-arms a 60 s
# expiry, so the counter only resets after 60 s WITHOUT a match. 15 404s spaced 10 s apart reach 15 although no 60 s
# window holds more than 7. 9590312 is evaluated in phase 1 of the client's NEXT request (the 404 is counted in phase 5);
# 9590314 fires on the 20th request without User-Agent itself (counted and checked in phase 1). Both reset on firing,
# so a steady poller without User-Agent raises 9590314 every 20 requests (see aipt-config.conf). Verified on ModSecurity
# 2.9.15 with SecDataDir during development. For an exact "N in 60 s" policy use the Suricata (9500008,
# 9500297, 9500299) or Sigma correlation versions.
SecAction \
    "id:9590310,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',initcol:ip=%{REMOTE_ADDR}"
SecRule RESPONSE_STATUS "@streq 404" \
    "id:9590311,phase:5,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',setvar:'ip.aipt_404=+1',expirevar:'ip.aipt_404=60'"
SecRule IP:aipt_404 "@ge 15" \
    "id:9590312,phase:1,pass,log,t:none,msg:'AIPT: Generic 404 accumulation from one client (idle-timeout counter, path enumeration)',logdata:'%{ip.aipt_404} responses with status 404 since the counter was last idle for 60 s',tag:'aipt',tag:'aipt/generic',tag:'aipt/alert',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING',setvar:'ip.aipt_404=0'"
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:9590313,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',setvar:'ip.aipt_noua=+1',expirevar:'ip.aipt_noua=60'"
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
    "id:9590315,phase:1,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',setvar:'ip.aipt_noua=+1',expirevar:'ip.aipt_noua=60'"
SecRule IP:aipt_noua "@ge 20" \
    "id:9590314,phase:1,pass,log,t:none,msg:'AIPT: Scanner accumulation of requests without User-Agent (idle-timeout counter)',logdata:'%{ip.aipt_noua} requests without User-Agent since the counter was last idle for 60 s',tag:'aipt',tag:'aipt/generic',tag:'aipt/alert',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING',setvar:'ip.aipt_noua=0'"

# ---- response fingerprints: a tool console is served behind this WAF (phase 4, needs SecResponseBodyAccess On) ----
# source: ARTEX server/server.go:947-949 (/api/health body)
SecRule RESPONSE_BODY "@rx \x22service\x22:\x22artex\x22" \
    "id:9590401,phase:4,pass,log,t:none,msg:'AIPT: ARTEX console served behind this WAF (health response)',tag:'aipt',tag:'aipt/artex',tag:'aipt/block-eligible',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING',setvar:'tx.aipt-plugin_console_hit=1'"
# source: CyberStrikeAI web/templates/index.html:14, api-docs.html:8
SecRule RESPONSE_BODY "@rx <title>(?:[^<]{0,40} - )?CyberStrikeAI</title>" \
    "id:9590402,phase:4,pass,log,t:none,msg:'AIPT: CyberStrikeAI console served behind this WAF',tag:'aipt',tag:'aipt/cyberstrikeai',tag:'aipt/alert',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING'"
# source: HexStrike-AI hexstrike_server.py:9123
SecRule RESPONSE_BODY "@contains HexStrike AI Tools API Server" \
    "id:9590403,phase:4,pass,log,t:none,msg:'AIPT: HexStrike-AI API server behind this WAF',tag:'aipt',tag:'aipt/hexstrike-ai',tag:'aipt/alert',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING'"
# source: PentAGI frontend/index.html:20
SecRule RESPONSE_BODY "@contains <title>PentAGI</title>" \
    "id:9590404,phase:4,pass,log,t:none,msg:'AIPT: PentAGI UI served behind this WAF',tag:'aipt',tag:'aipt/pentagi',tag:'aipt/alert',tag:'paranoia-level/1',ver:'aipt-plugin/1.0.0',severity:'WARNING'"
# Opt-in outbound score for a WAF that fronts an ARTEX console (switch 9590013 in aipt-config.conf; off by default):
# the ARTEX health-response fingerprint 9590401 adds the CRS critical outbound score, so CRS RESPONSE-959 blocks the
# response at the default outbound threshold. Other response fingerprints (9590402-9590404) never score.
SecRule TX:aipt-plugin_console_hit "@eq 1" \
    "id:9590091,phase:4,pass,nolog,t:none,ver:'aipt-plugin/1.0.0',chain"
    SecRule TX:aipt-plugin_console_response_scoring "@eq 1" "t:none,setvar:'tx.outbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
