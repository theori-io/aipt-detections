# ------------------------------------------------------------------------------------------------------------------
# AIPT CRS plugin - configuration (aipt-config.conf)
# Detection pack for LLM-driven autonomous pentest tools; OWASP CRS v4 plugin, ModSecurity v3 / v2.9
# Version:  1.0.0 (2026-10-12)
# License:  Detection Rule License (DRL) 1.1 - https://github.com/SigmaHQ/Detection-Rule-License
# Rule ids: 9,590,000-9,590,999 (this plugin's CRS plugin range)
#             9590010-9590019  configuration switches (this file; 9590014 is the exemption example below)
#             9590020-9590099  plugin control (defaults, paranoia level 9590022-9590025, scoring) in aipt-before.conf
#             9590100-9590199  ARTEX            9590200-9590299  AI-pentest family (tool-specific)
#             9590300-9590399  generic shapes   9590400-9590499  response fingerprints (phase 4)
# Install:  copy aipt-config.conf and aipt-before.conf into the CRS plugins directory
#           (e.g. /etc/modsecurity.d/owasp-crs/plugins/ in the owasp/modsecurity-crs images); CRS includes
#           plugins/*-config.conf and plugins/*-before.conf after crs-setup.conf and before rules/*.conf.
# ------------------------------------------------------------------------------------------------------------------
#
# Enable or disable the whole plugin (enabled when unset).
#
#SecAction \
#    "id:9590010,\
#    phase:1,\
#    pass,\
#    nolog,\
#    t:none,\
#    ver:'aipt-plugin/1.0.0',\
#    setvar:'tx.aipt-plugin_enabled=1'"

#
# Per-client idle-timeout accumulators (404s, requests without User-Agent; rules 9590310-9590319).
# These are NOT sliding windows: each match adds 1 and re-arms a 60 s expiry, so the count keeps growing
# while matches arrive less than 60 s apart (15 404s at 10 s spacing reach 15; no 60 s window holds more than 7).
# 9590312 (404s) is raised on the client's NEXT request after the 15th 404 (the status is only known in phase 5);
# 9590314 (no User-Agent) is raised on the 20th such request itself; both reset the counter when they fire.
# Consequence: a client without User-Agent that polls faster than once a minute (health checks, monitoring) raises
# 9590314 on every 20th poll (tested: 5 s polling for 5 min -> polls 20, 40, 60), although no 60 s window holds 20.
# Give such pollers a User-Agent, or exempt their addresses, e.g.
#   SecRule REMOTE_ADDR "@ipMatch 192.0.2.53" "id:9590014,phase:1,pass,nolog,ctl:ruleRemoveById=9590313,ctl:ruleRemoveById=9590315"
# Use the Suricata/Sigma versions for an exact "N in 60 s" policy.
# Off by default: they keep state in the IP collection, which REQUIRES A PERSISTENT COLLECTION BACKEND shared by all
# workers (ModSecurity v2 SecDataDir, or a libmodsecurity v3 build with an LMDB collection backend). Without one the
# counters reset on every transaction and never fire (verified on owasp/modsecurity-crs:nginx-alpine). With one they
# behave as described (verified on owasp/modsecurity-crs:apache, ModSecurity 2.9.15, CRS 4.30.0, the image's
# SecDataDir /tmp/modsecurity/data, during development). State is per SecDataDir, i.e. per WAF host, and the
# image's default location does not survive a container restart. The Suricata (9500008, 9500297, 9500299) and Sigma
# correlation versions of these shapes do not have this limitation.
#
#SecAction \
#    "id:9590011,\
#    phase:1,\
#    pass,\
#    nolog,\
#    t:none,\
#    ver:'aipt-plugin/1.0.0',\
#    setvar:'tx.aipt-plugin_rate_counters=1'"

#
# Opt-in INBOUND anomaly score for the five product User-Agent rules 9590101, 9590103, 9590201, 9590211, 9590221
# (blocking policy). Off by default: the plugin is then observe-only. Every AIPT match is logged with its tags, no
# rule adds an anomaly score, and the plugin never contributes to a CRS block, whatever SecRuleEngine and the CRS
# thresholds of the host are. With the switch on, a request that matches one of the five rules receives the CRS
# critical inbound score through rule 9590090 and CRS blocks it at its normal inbound threshold (5 at paranoia
# level 1, so a single match blocks). Enable it only after the observe-mode baseline described in DEPLOYMENT.md, and
# per WAF; the outbound switch 9590013 below is separate. Rollback: comment the rule out again (no other change needed).
#
#SecAction \
#    "id:9590015,\
#    phase:1,\
#    pass,\
#    nolog,\
#    t:none,\
#    ver:'aipt-plugin/1.0.0',\
#    setvar:'tx.aipt-plugin_inbound_scoring=1'"

#
# Opt-in outbound score for the ARTEX console response fingerprint (blocking policy). Uncomment ONLY on a WAF
# that fronts an ARTEX console you want to block: rule 9590401 then adds the CRS critical outbound score (rule 9590091)
# and CRS blocks the response at its outbound threshold. Off by default: without it 9590401 logs only. No other
# response fingerprint can score. Enable it only after the observe-mode baseline (DEPLOYMENT.md).
#
#SecAction \
#    "id:9590013,\
#    phase:1,\
#    pass,\
#    nolog,\
#    t:none,\
#    ver:'aipt-plugin/1.0.0',\
#    setvar:'tx.aipt-plugin_console_response_scoring=1'"

#
# Approved-assessment allowlist switch. A sanctioned external assessment (contracted pentest or ASM service) should not
# raise the GENERIC shape rules (9590300-9590399); every tool-specific rule stays active. To enable: create
# aipt-approved-assessment-sources.txt next to this file (one IPv4/IPv6 address or CIDR per line, obtained from the
# vendor for the engagement), check it exists, then uncomment the rule. @ipMatchFromFile makes ModSecurity refuse to
# start when the file is missing, which is why the rule ships commented out.
#
#SecRule REMOTE_ADDR "@ipMatchFromFile aipt-approved-assessment-sources.txt" \
#    "id:9590012,\
#    phase:1,\
#    pass,\
#    nolog,\
#    t:none,\
#    ver:'aipt-plugin/1.0.0',\
#    tag:'aipt',\
#    ctl:ruleRemoveById=9590300-9590399"
